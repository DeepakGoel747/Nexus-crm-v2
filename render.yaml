services:
  - type: web
    name: nexaflow-crm
    runtime: node
    region: oregon
    plan: free
    branch: deploy/nexaflow-render
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nexaflow-crm-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: nexaflow-crm-db
    databaseName: nexaflow_crm
    user: nexaflow_crm
    plan: free
    region: oregon
